[project]
name = "document-copilot-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "alembic==1.20.0",
    "fastapi==0.143.0",
    "httpx==0.28.1",
    "openai==3.29.0",
    "pgvector==0.5.1",
    "psycopg[binary]==3.3.6",
    "pydantic==2.14.1",
    "pydantic-ai==2.55.0",
    "pydantic-settings==2.15.0",
    "sqlalchemy==2.1.4",
    "structlog==26.1.0",
    "supabase==2.32.0",
    "uvicorn==0.54.0",
]

[tool.uv]
add-bounds = "exact"
exclude-newer = "7 days"

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.17.2",
]
